name: Build Castlehold Android
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          fi
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "No usable sdkmanager found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using Android SDK: $ANDROID_HOME"
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          java -version
      - name: Install Android packages if missing
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          [ -x "$ANDROID_HOME/platform-tools/adb" ] || packages+=("platform-tools")
          [ -d "$ANDROID_HOME/build-tools/35.0.1" ] || packages+=("build-tools;35.0.1")
          [ -d "$ANDROID_HOME/platforms/android-35" ] || packages+=("platforms;android-35")
          [ -d "$ANDROID_HOME/ndk/28.1.13356709" ] || packages+=("ndk;28.1.13356709")
          [ -d "$ANDROID_HOME/cmake/3.10.2.4988404" ] || packages+=("cmake;3.10.2.4988404")
          if [ ${#packages[@]} -gt 0 ]; then
            echo "Installing missing Android packages: ${packages[*]}"
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "${packages[@]}"
          else
            echo "Required Godot Android packages are already present on the GitHub runner."
          fi
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/build-tools/35.0.1"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/ndk/28.1.13356709"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
      - name: Download pinned Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/castlehold-godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl --http1.1 --fail --location --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 'https://downloads.godotengine.org/?version=4.7.2&flavor=stable&platform=linux.64&slug=linux.x86_64.zip' -o "$RUNNER_TEMP/castlehold-godot/editor.zip"
          unzip -q "$RUNNER_TEMP/castlehold-godot/editor.zip" -d "$RUNNER_TEMP/castlehold-godot"
          chmod +x "$RUNNER_TEMP/castlehold-godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "$RUNNER_TEMP/castlehold-godot" >> "$GITHUB_PATH"
          curl --http1.1 --fail --location --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 'https://downloads.godotengine.org/?version=4.7.2&flavor=stable&platform=templates&slug=export_templates.tpz' -o "$RUNNER_TEMP/castlehold-godot/templates.tpz"
          unzip -q "$RUNNER_TEMP/castlehold-godot/templates.tpz" 'templates/android_debug.apk' 'templates/android_release.apk' -d "$RUNNER_TEMP/castlehold-godot"
          cp "$RUNNER_TEMP/castlehold-godot/templates/"*.apk "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Import and integration tests
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path project --editor --import 2>&1 | tee import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load' import.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path project --script ../tests/integration.gd -- --test 2>&1 | tee tests.log
          ! grep -E 'SCRIPT ERROR|FAIL:' tests.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path project --script ../tests/camera_and_fortress.gd -- --test 2>&1 | tee camera-tests.log
          ! grep -E 'SCRIPT ERROR|FAIL:' camera-tests.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path project --script ../tests/graphics.gd -- --test 2>&1 | tee graphics-tests.log
          ! grep -E 'SCRIPT ERROR|FAIL:' graphics-tests.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path project --script ../tests/premium_combat.gd -- --test 2>&1 | tee premium-combat-tests.log
          ! grep -E 'SCRIPT ERROR|FAIL:' premium-combat-tests.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path project --script ../tests/branding_splash.gd -- --test 2>&1 | tee branding-splash-tests.log
          ! grep -E 'SCRIPT ERROR|FAIL:' branding-splash-tests.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path project --script ../tests/anti_flash.gd -- --test 2>&1 | tee anti-flash-tests.log
          ! grep -E 'SCRIPT ERROR|FAIL:' anti-flash-tests.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path project --script ../tests/audio_settings.gd -- --test 2>&1 | tee audio-tests.log
          ! grep -E 'SCRIPT ERROR|FAIL:' audio-tests.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path project --script ../tests/defeat_voices.gd -- --test 2>&1 | tee defeat-voice-tests.log
          ! grep -E 'SCRIPT ERROR|FAIL:' defeat-voice-tests.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path project --script ../tests/battle_speed.gd -- --test 2>&1 | tee battle-speed-tests.log
          ! grep -E 'SCRIPT ERROR|FAIL:' battle-speed-tests.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path project --script ../tests/finale_and_save.gd -- --test 2>&1 | tee finale-save-tests.log
          ! grep -E 'SCRIPT ERROR|FAIL:' finale-save-tests.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path project --script ../tests/horde.gd -- --test 2>&1 | tee horde-tests.log
          ! grep -E 'SCRIPT ERROR|FAIL:' horde-tests.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path project --script ../tests/ogre_elites.gd -- --test 2>&1 | tee ogre-elites-tests.log
          ! grep -E 'SCRIPT ERROR|FAIL:' ogre-elites-tests.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path project --script ../tests/bosses.gd -- --test 2>&1 | tee boss-tests.log
          ! grep -E 'SCRIPT ERROR|FAIL:' boss-tests.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path project --script ../tests/necromancer.gd -- --test 2>&1 | tee necromancer-tests.log
          ! grep -E 'SCRIPT ERROR|FAIL:' necromancer-tests.log
      - name: Continuous siege and endurance tests
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path project --script ../tests/continuous_siege.gd -- --test 2>&1 | tee siege-tests.log
          ! grep -E 'SCRIPT ERROR|FAIL:' siege-tests.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path project --script ../tests/siege_endurance.gd -- --test 2>&1 | tee endurance-tests.log
          ! grep -E 'SCRIPT ERROR|FAIL:' endurance-tests.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path project --script ../tests/siege_endurance.gd -- --test --archers-only 2>&1 | tee archer-policy-tests.log
          ! grep -E 'SCRIPT ERROR|FAIL:' archer-policy-tests.log
      - name: Configure SDK and debug signing
        shell: bash
        run: |
          python3 tools/configure_android.py
          mkdir -p build
          keytool -genkeypair -keystore "$RUNNER_TEMP/castlehold-debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Castlehold Debug" -keyalg RSA -keysize 2048 -validity 10000
      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/castlehold-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path project --export-debug Android ../build/Castlehold-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Castlehold-Android-debug
          path: build/Castlehold-debug.apk
          if-no-files-found: error
